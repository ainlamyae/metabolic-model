<h2 id="appendix-interactive-calculation-sheet" class="appendix-heading">Interactive Calculation Sheet</h2>

<fieldset class="formula-solve-for">
    <legend>Solve for</legend>
    <label><input type="radio" name="formula-solve-for" value="EIN" checked> Calories</label>
    <label><input type="radio" name="formula-solve-for" value="TARGET_MASS"> Healthy body mass</label>
    <label><input type="radio" name="formula-solve-for" value="TAU"> Activity</label>
    <label><input type="radio" name="formula-solve-for" value="DELTA_M"> Weekly fat loss</label>
    <label title="Hold the weekly fat loss at a percentage of your body mass. The kilograms per week, the calorie target and the arrival date are all computed from it — and the date follows the proportional journey, where the kilograms shrink as you do.">
        <input type="radio" name="formula-solve-for" value="FIXED_PCT"> Weekly fat loss %
    </label>
</fieldset>

<fieldset class="formula-solve-for formula-bmr-formula">
    <legend>Basal metabolic rate</legend>
    <label title="Mifflin-St Jeor (1990): BMR from body mass, height, age and sex. The original equation, and the one that needs no lean-mass estimate.">
        <input type="radio" name="formula-bmr-formula" value="mifflin" checked>
        Mifflin-St Jeor (m, h, a, σ)
    </label>
    <label title="Katch-McArdle (1996): BMR = 370 + 21.6 × LBM. Fat mass is nearly inert metabolically, so this predicts from lean mass alone — more accurate the better your LBM figure is, and here LBM is the Boer estimate below. Age drops out entirely; sex enters only through LBM.">
        <input type="radio" name="formula-bmr-formula" value="katch">
        Katch-McArdle (LBM)
    </label>
</fieldset>

<div class="formula-inputs">
    <label class="formula-row" title="The mean of every weigh-in in the 7 days ending at your latest one — m̄(t) = (1/7) × Σ m(t−i). Water and glycogen move the scale by more than a week of fat loss does, and the decay model assumes clean mass, so every formula here reads this rather than a single day's reading.">
        <span class="formula-sym">m̄</span>
        <span class="formula-name">7-day rolling average body mass</span>
        <input type="text" id="formula-body-mass-smooth" inputmode="decimal">
        <span class="formula-unit">kg</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">h</span>
        <span class="formula-name">height</span>
        <input type="text" id="formula-height" inputmode="decimal">
        <span class="formula-unit">cm</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">a</span>
        <span class="formula-name">age</span>
        <input type="text" id="formula-age" inputmode="decimal">
        <span class="formula-unit">years</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">σ</span>
        <span class="formula-name">sex</span>
        <select id="formula-sex">
            <option value="male">male</option>
            <option value="female">female</option>
        </select>
        <span class="formula-unit"></span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">m_des</span>
        <span class="formula-name">healthy body mass</span>
        <input type="text" id="formula-target" inputmode="decimal">
        <span class="formula-unit">kg</span>
    </label>
    <label class="formula-row" title="The BMI your target body mass comes to at your height — BMI = m_des / (h/100)². Type a target mass and this follows it; type a BMI here and the target mass follows instead. The healthy band is 18.5–24.9, and outside it the box goes red. In Solve for → Target body mass both are answers, so neither is typed.">
        <span class="formula-sym">BMI_des</span>
        <span class="formula-name">healthy body mass index</span>
        <input type="text" id="formula-target-bmi" inputmode="decimal">
        <span class="formula-unit">kg/m²</span>
    </label>
    <!-- Moved up from the protein block to sit with the rest of the profile it's
         derived from (m̄, h, σ) and directly above BMR: under Katch-McArdle, BMR is
         built from this figure rather than the other way around, so it has to be
         known before BMR is. -->
    <label class="formula-row" title="Lean body mass, Boer (1984): for men, 0.407×m̄ + 0.267×h − 19.2; for women, 0.252×m̄ + 0.473×h − 48.3. Not editable: it is derived from m̄, h and σ. Feeds Katch-McArdle BMR above and the protein/glycogen bands below.">
        <span class="formula-sym">LBM</span>
        <span class="formula-name">lean body mass</span>
        <input type="text" id="formula-lbm" inputmode="decimal" readonly>
        <span class="formula-unit">kg</span>
    </label>
    <hr class="formula-divider">
    <label class="formula-row" title="Resting energy expenditure at your smoothed body mass, from whichever equation is selected above — what you burn before any movement. Not editable: it is derived from m̄, h, a and σ.">
        <span class="formula-sym">BMR</span>
        <span class="formula-name">basal metabolic rate, at m̄</span>
        <input type="text" id="formula-bmr" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <!-- Marks the end of the profile block (m̄, h, a, σ, LBM, BMR) before the
         activity block starts below. -->
    <hr class="formula-divider">
    <label class="formula-row">
        <span class="formula-sym">τ</span>
        <span class="formula-name">desired activity</span>
        <input type="text" id="formula-activity-min" inputmode="decimal">
        <span class="formula-unit">min/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">MET</span>
        <span class="formula-name">activity intensity</span>
        <input type="text" id="formula-met" inputmode="decimal">
        <span class="formula-unit">MET</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">κ</span>
        <span class="formula-name">oxygen uptake per MET</span>
        <input type="text" id="formula-met-o2" inputmode="decimal">
        <span class="formula-unit">mL O₂/kg/min</span>
    </label>
    <div class="formula-row formula-row-fixed">
        <span class="formula-sym">ε</span>
        <span class="formula-name">oxygen energy yield</span>
        <span class="formula-fixed">200</span>
        <span class="formula-unit">mL O₂/kcal</span>
    </div>
    <label class="formula-row" title="Activity energy expenditure (AEE) at that target: AEE = MET × m̄ × τ × κ / ε. Not editable: it is derived from MET, τ and κ above.">
        <span class="formula-sym">AEE</span>
        <span class="formula-name">daily desired activity energy expenditure</span>
        <input type="text" id="formula-activity-kcal" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <!-- Marks the end of the activity block (MET, τ, κ, AEE) before the sleep block
         starts below. -->
    <hr class="formula-divider">
    <!-- The sleep length the PLAN assumes, not a log of what actually happened.
         Defaults to the assumed 8-hour target itself (0 kcal effect) so an untouched
         box changes nothing. -->
    <label class="formula-row" title="How much sleep the plan assumes you're actually getting, compared against an assumed 8-hour sleep target. Short of it and the Sleep Efficiency Factor η below 1 means the same weekly fat-loss rate needs a bigger real deficit — see the Deprivation Effect row right below. Defaults to that 8-hour target itself, which is 0 effect.">
        <span class="formula-sym">s</span>
        <span class="formula-name">sleep length</span>
        <input type="text" id="formula-plan-sleep-hours" inputmode="decimal">
        <span class="formula-unit">hr/day</span>
    </label>
    <label class="formula-row" title="Reduction in fat-loss efficiency per hour of sleep below target — η = 1 − (γ/100) × hours short. The literature's own range is 2-3%/hr; this defaults to the 2.5%/hr midpoint and can be tuned.">
        <span class="formula-sym">γ</span>
        <span class="formula-name">sleep deprivation rate</span>
        <input type="text" id="formula-sleep-deprivation-pct" inputmode="decimal">
        <span class="formula-unit">%/hr</span>
    </label>
    <label class="formula-row" title="η = 1 − (γ/100) × hours short of the 8-hour sleep target. kcal/day this adds to D below because that much of the deficit stops translating into fat loss on a short night. Zero at or above the sleep target. Not editable: it is derived from s and γ above.">
        <span class="formula-sym">δ</span>
        <span class="formula-name">Sleep Deprivation Effect</span>
        <input type="text" id="formula-deprivation-effect" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <!-- Marks the end of the sleep block (s, γ, δ) before the rate block starts
         below. -->
    <hr class="formula-divider">
    <label class="formula-row" title="A weekly loss of 0.5–1% of body mass is the usual sustainable range, and 1% the ceiling — above it, more of what comes off is lean mass. Type a percentage and Δm below follows it; type kilograms there and this follows instead.">
        <span class="formula-sym">Δm%</span>
        <span class="formula-name">weekly fat loss, as a share of body mass</span>
        <input type="text" id="formula-weekly-loss-pct" inputmode="decimal">
        <span class="formula-unit">%/week</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">Δm</span>
        <span class="formula-name">weekly fat loss</span>
        <input type="text" id="formula-weekly-loss" inputmode="decimal">
        <span class="formula-unit">kg/week</span>
    </label>
    <div class="formula-row formula-row-fixed">
        <span class="formula-sym">ρ</span>
        <span class="formula-name">fat energy density</span>
        <span class="formula-fixed">7700</span>
        <span class="formula-unit">kcal/kg</span>
    </div>
    <label class="formula-row" title="The daily energy shortfall your weekly fat-loss target implies: D = Δm × ρ / 7. This is what comes off maintenance to give the target intake — not calories burned by activity, which is AEE.">
        <span class="formula-sym">D</span>
        <span class="formula-name">daily energy deficit</span>
        <input type="text" id="formula-deficit" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <!-- Marks the end of the rate block (Δm%, Δm, ρ, D) before the calorie-solve
         block (f, TEF, M, E_in) starts below. -->
    <hr class="formula-divider">
    <label class="formula-row" title="The thermic effect of food: the share of what you eat that is spent digesting it — about 10% on a mixed diet, higher on protein. It is part of expenditure, so counting it RAISES the intake that produces the same deficit. Left at 0 by default; type 10 to include it.">
        <span class="formula-sym">f</span>
        <span class="formula-name">thermic effect of food, as a share of E_in</span>
        <input type="text" id="formula-tef-pct" inputmode="decimal">
        <span class="formula-unit">% of E_in</span>
    </label>
    <label class="formula-row" title="What that share comes to in calories: TEF = f × E_in. Zero while f is zero.">
        <span class="formula-sym">TEF</span>
        <span class="formula-name">energy spent digesting that intake</span>
        <input type="text" id="formula-tef" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <!-- Marks the end of the TEF pair (f, TEF) before M and E_in start below. -->
    <hr class="formula-divider">
    <label class="formula-row" title="Maintenance: BMR + the activity energy expenditure (AEE) that hitting τ minutes at MET produces. The intake that would hold your body mass still — the deficit D is measured down from this, and E_in is what's left.">
        <span class="formula-sym">M</span>
        <span class="formula-name">maintenance at m̄ — BMR + AEE</span>
        <input type="text" id="formula-maintenance" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">E_in</span>
        <span class="formula-name">desired daily intake</span>
        <input type="text" id="formula-ein" inputmode="decimal">
        <span class="formula-unit">kcal</span>
    </label>
    <!-- Marks the end of the calorie-solve block, E_in, before the journey block
         (t, dates) starts below. -->
    <hr class="formula-divider" title="TEF is already built into E_in above — the identity is solved with f in the denominator, not summed — so it is not a further deficit to subtract on top of it.">
    <label class="formula-row">
        <span class="formula-sym">t</span>
        <span class="formula-name">days to m_des, holding E_in daily</span>
        <input type="text" id="formula-days" inputmode="decimal">
        <span class="formula-unit">days</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym"></span>
        <span class="formula-name">estimated arrival date</span>
        <input type="date" id="formula-eta">
        <span class="formula-unit" id="formula-eta-note"></span>
    </label>
    <label class="formula-row" title="Metabolic adaptation: on a sustained deficit, BMR falls faster than the lost mass alone explains — less leptin and T3, quieter sympathetic tone, cheaper movement. Roughly 1% of BMR per week on the diet, levelling off near 10–15%. Refeeds and diet breaks push it back toward 0, which is what setting this to 0 models.">
        <span class="formula-sym">λ</span>
        <span class="formula-name">metabolic adaptation, per week on the diet</span>
        <input type="text" id="formula-adapt-per-week" inputmode="decimal">
        <span class="formula-unit">% of BMR/week</span>
    </label>
    <label class="formula-row" title="Where λt stops growing. The literature puts the floor around 10–15% below the predicted BMR, reached by week 10–12 — past that, further loss comes from mass rather than deepening adaptation.">
        <span class="formula-sym">λt_max</span>
        <span class="formula-name">adaptation ceiling</span>
        <input type="text" id="formula-adapt-cap" inputmode="decimal">
        <span class="formula-unit">% of BMR</span>
    </label>
    <label class="formula-row" title="BMR_adapt(t) = BMR × (1 − λt), at the day count t above.">
        <span class="formula-sym">BMR_adp</span>
        <span class="formula-name">adapted BMR by t</span>
        <input type="text" id="formula-bmr-adapt" inputmode="decimal" readonly>
        <span class="formula-unit">kcal/day</span>
    </label>
    <label class="formula-row" title="The plateau once BMR has adapted: the same m∞ = (E_in − A)/B with the BMR half of A and B scaled by (1 − λt). It sits ABOVE the m∞ printed in the trace, and that gap is why a constant-BMR forecast tends to overshoot in practice.">
        <span class="formula-sym">m∞_adp</span>
        <span class="formula-name">adapted plateau, and the overshoot it implies</span>
        <input type="text" id="formula-plateau-adapt" inputmode="decimal" readonly>
        <span class="formula-unit">kg</span>
    </label>
    <!-- Marks the end of the journey block (t, arrival date, adaptation) before the
         glycogen block starts below. -->
    <hr class="formula-divider">
    <label class="formula-row" title="Skeletal muscle, as a direct share of LBM — not of m̄, since it's a fat-free-mass ratio and m̄ still carries the fat. Skeletal muscle runs roughly 40-50% of lean body mass; the rest of LBM is water, organs, skin and bone, none of which store meaningful glycogen. Higher toward 50% for a more muscular frame, lower toward 40% otherwise.">
        <span class="formula-sym">s</span>
        <span class="formula-name">skeletal muscle, share of lean mass</span>
        <input type="text" id="formula-glycogen-skeletal-frac" inputmode="decimal" value="45">
        <span class="formula-unit">% of LBM</span>
    </label>
    <label class="formula-row" title="LBM × s — the actual skeletal muscle mass the glycogen density below applies to, rather than all of LBM (which also counts water, organs, skin and bone).">
        <span class="formula-sym">m_musc</span>
        <span class="formula-name">skeletal muscle mass</span>
        <input type="text" id="formula-glycogen-muscle" inputmode="decimal" readonly>
        <span class="formula-unit">kg</span>
    </label>
    <label class="formula-row" title="Grams of glycogen per kg of actual muscle tissue — resting muscle glycogen runs roughly 13-15 g/kg wet weight (about 70-85 mmol/kg). This is the muscle-tissue density itself, not diluted across LBM, which is why it's applied to m_musc above rather than to LBM directly.">
        <span class="formula-sym">g_musc</span>
        <span class="formula-name">glycogen per kg of muscle mass</span>
        <input type="text" id="formula-glycogen-per-kg-muscle" inputmode="decimal" value="14">
        <span class="formula-unit">g/kg muscle</span>
    </label>
    <label class="formula-row" title="The liver's own glycogen reserve — roughly constant across adults regardless of muscle mass, commonly cited around 100g.">
        <span class="formula-sym">g_liver</span>
        <span class="formula-name">liver glycogen reserve</span>
        <input type="text" id="formula-glycogen-liver" inputmode="decimal" value="100">
        <span class="formula-unit">g</span>
    </label>
    <label class="formula-row" title="g_musc × m_musc + g_liver. Not editable directly — tune the coefficients above if this doesn't match what you observe.">
        <span class="formula-sym">m_gly</span>
        <span class="formula-name">glycogen store, from muscle mass</span>
        <input type="text" id="formula-glycogen-g" inputmode="decimal" readonly>
        <span class="formula-unit">g</span>
    </label>
    <label class="formula-row" title="Grams of water glycogen holds onto per gram of itself — commonly cited as 3–4. Tune this to whatever ratio makes ΔM_gly below match what you actually see on the scale.">
        <span class="formula-sym">r</span>
        <span class="formula-name">water bound per gram of glycogen</span>
        <input type="text" id="formula-glycogen-water-ratio" inputmode="decimal" value="3">
        <span class="formula-unit">g H2O / g glycogen</span>
    </label>
    <label class="formula-row" title="ΔM_gly = m_gly × (1 + r) — the scale swing glycogen and its bound water can account for on their own. A day-to-day move up to about this size is water and glycogen, not fat; anything consistently larger than it, held over more than a day or two, is the real signal.">
        <span class="formula-sym">ΔM_gly</span>
        <span class="formula-name">glycogen + water swing</span>
        <input type="text" id="formula-glycogen-swing" inputmode="decimal" readonly>
        <span class="formula-unit">kg</span>
    </label>
    <!-- Marks the end of the glycogen block (s…ΔM_gly) before the protein block
         starts below. -->
    <hr class="formula-divider">
    <label class="formula-row">
        <span class="formula-sym">p_min</span>
        <span class="formula-name">protein floor per kg of lean mass</span>
        <input type="text" id="formula-protein-per-kg-min" inputmode="decimal">
        <span class="formula-unit">g/kg LBM/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">p_max</span>
        <span class="formula-name">protein ceiling per kg of lean mass</span>
        <input type="text" id="formula-protein-per-kg-max" inputmode="decimal">
        <span class="formula-unit">g/kg LBM/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">P_min</span>
        <span class="formula-name">desired daily protein, lower end</span>
        <input type="text" id="formula-protein-min" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">P_max</span>
        <span class="formula-name">desired daily protein, upper end</span>
        <input type="text" id="formula-protein-max" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <!-- Marks the end of the protein block (P_min, P_max) before the fiber block
         starts below. -->
    <hr class="formula-divider">
    <!-- The fiber band follows protein: a floor scaled to how much you eat (14 g per
         1,000 kcal, the USDA/DGA rule of thumb) and a ceiling scaled to body weight
         (0.5 g/kg) — two different bases, unlike protein's single LBM, so both
         coefficients are editable and neither rides on a box the other computes. -->
    <label class="formula-row">
        <span class="formula-sym">b_min</span>
        <span class="formula-name">dietary fiber floor per 1,000 kcal of intake</span>
        <input type="text" id="formula-fiber-per-1000kcal-min" inputmode="decimal">
        <span class="formula-unit">g/1,000 kcal</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">b_max</span>
        <span class="formula-name">dietary fiber ceiling per kg of body weight</span>
        <input type="text" id="formula-fiber-per-kg-max" inputmode="decimal">
        <span class="formula-unit">g/kg/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">F_min</span>
        <span class="formula-name">desired daily dietary fiber, lower end</span>
        <input type="text" id="formula-fiber-min" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">F_max</span>
        <span class="formula-name">desired daily dietary fiber, upper end</span>
        <input type="text" id="formula-fiber-max" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <!-- Marks the end of the fiber block (F_min, F_max) before the fat block
         starts below. -->
    <hr class="formula-divider">
    <!-- The fat band follows fiber, same two-different-bases shape but both ends
         scaled off E_in instead of one off body weight: 20-35% of total energy from fat
         is the Institute of Medicine's Acceptable Macronutrient Distribution Range for
         adults (Dietary Reference Intakes for Energy, Carbohydrate, Fiber, Fat, Fatty
         Acids, Cholesterol, Protein, and Amino Acids, 2005), also the range the USDA
         Dietary Guidelines for Americans carries forward — not a guessed 25%, which
         sits inside this band rather than defining it. 9 kcal/g is fat's fixed energy
         density (Atwater), not a personal parameter, so only the two percentages are
         editable. -->
    <label class="formula-row">
        <span class="formula-sym">k_min</span>
        <span class="formula-name">fat floor, share of intake calories</span>
        <input type="text" id="formula-fat-pct-min" inputmode="decimal">
        <span class="formula-unit">% of E_in</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">k_max</span>
        <span class="formula-name">fat ceiling, share of intake calories</span>
        <input type="text" id="formula-fat-pct-max" inputmode="decimal">
        <span class="formula-unit">% of E_in</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">G_min</span>
        <span class="formula-name">desired daily fat, lower end</span>
        <input type="text" id="formula-fat-min" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">G_max</span>
        <span class="formula-name">desired daily fat, upper end</span>
        <input type="text" id="formula-fat-max" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <!-- Marks the end of the fat block (G_min, G_max) before the carb block starts
         below. -->
    <hr class="formula-divider">
    <!-- The carb band follows fat, same shape again — both ends a share of E_in:
         45-65% of total energy from carbohydrate is the same IOM AMDR report's range
         for carbohydrate, also carried forward by the USDA Dietary Guidelines for
         Americans. 4 kcal/g is carbohydrate's fixed energy density (Atwater), not a
         personal parameter, so only the two percentages are editable. -->
    <label class="formula-row">
        <span class="formula-sym">q_min</span>
        <span class="formula-name">carbohydrate floor, share of intake calories</span>
        <input type="text" id="formula-carb-pct-min" inputmode="decimal">
        <span class="formula-unit">% of E_in</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">q_max</span>
        <span class="formula-name">carbohydrate ceiling, share of intake calories</span>
        <input type="text" id="formula-carb-pct-max" inputmode="decimal">
        <span class="formula-unit">% of E_in</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">C_min</span>
        <span class="formula-name">desired daily carbohydrate, lower end</span>
        <input type="text" id="formula-carb-min" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
    <label class="formula-row">
        <span class="formula-sym">C_max</span>
        <span class="formula-name">desired daily carbohydrate, upper end</span>
        <input type="text" id="formula-carb-max" inputmode="decimal" readonly>
        <span class="formula-unit">g/day</span>
    </label>
</div>

<figure class="mtc-figure" id="fig_masstrajectory">
    <div id="mass-trajectory-chart" class="mass-trajectory-chart"></div>

    <figcaption>Fig. 2. Four linked subplots over the same projected timeline, from today through 14 days past the estimated arrival date (dashed vertical line); past arrival, mass holds at m_des and E_in steps up to whatever intake keeps the balance in (b) at zero, so all four panels' tails show maintenance rather than more of the same deficit. (a) Projected body mass trajectory from the current 7-day rolling average (m̄) to the healthy mass (m_des), under the exponential decay model of <a href="#maintenance-and-mass-trajectory">Section 2.3</a>. The amber band denotes the glycogen- and water-attributable scale swing (ΔM_gly) straddling the curve, per <a href="#glycogen-and-water-storage">Section 2.4</a>; the teal band marks the WHO healthy body-mass-index range (18.5–24.9 kg/m²), per <a href="#healthy-human-body-mass-index">Section 2.1.3</a>. Right ordinate: body mass index, a linear rescaling of the left ordinate by height. (b) Daily <a href="#energy-balance-components">energy balance</a>, signed by physical direction: energy leaving the body — <a href="#resting-energy-expenditure">BMR</a>, <a href="#activity-energy-expenditure">AEE</a>, their sum M, and digestion cost <a href="#thermic-effect-of-food">TEF</a> — plotted negative, and intake E_in entering it plotted positive; D, the net balance, negative during an actual deficit and positive during a surplus, with the <a href="#sleep-deprivation-effect">sleep-deprivation</a> penalty (δ) shown positive when present. Right ordinate: grams of dietary fat, a fixed 9 kcal/g rescaling of the same left-ordinate values. (c) <a href="#desire-daily-intake">E_in</a>, the desired daily intake held fixed through the trajectory (left ordinate, kcal/day); layered beneath it, purely comparative, the <a href="#protein-requirements">protein</a>, <a href="#dietary-fiber-requirements">dietary fiber</a>, <a href="#fat-requirements">fat</a> and <a href="#carbohydrate-requirements">carbohydrate</a> bands (bottom to top), each a solid floor at its minimum under a lighter ceiling at its maximum — no gram axis, since the stack sums four different substances a single scale couldn't read accurately for any one of them. (d) Activity calories burned, negative as energy leaving the body (left ordinate), against the fixed activity duration τ (right ordinate, a duration rather than an energy flow, so left positive; dashed).</figcaption>
</figure>
